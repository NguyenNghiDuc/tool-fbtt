services:
  app:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - fbtt-data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  fbtt-data:
